name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Senha efêmera usada APENAS nos runners de CI (banco de teste descartável,
# destruído ao fim do job). Nunca usar em produção. Centralizada aqui e
# referenciada via ${{ env.TEST_DB_PASSWORD }} — sem literal espalhado.
env:
  TEST_DB_PASSWORD: test_password

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: hexavante_test
        ports:
          # Loopback do runner apenas — o job acessa via localhost,
          # nada é exposto para fora da máquina efêmera do CI.
          - "127.0.0.1:3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          # Loopback do runner apenas (mesmo motivo do MySQL acima).
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: mysql://root:${{ env.TEST_DB_PASSWORD }}@localhost:3306/hexavante_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -d dist && echo "dist/ exists" || (echo "dist/ missing" && exit 1)
